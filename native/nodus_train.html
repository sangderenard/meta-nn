<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nodus — Browser Training</title>
<style>
  :root { --bg: #111; --fg: #ccc; --accent: #fa0; --link: #6df; --card: #1a1a1a;
          --border: #333; --ok: #4c8; --warn: #fa0; --err: #f44; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', monospace; background: var(--bg); color: var(--fg);
         padding: 1em; max-width: 1100px; margin: 0 auto; }
  h1 { color: var(--accent); margin-bottom: .5em; font-size: 1.3em; }
  h2 { color: var(--link); margin: 1em 0 .4em; font-size: 1.05em; }
  button { background: #333; color: var(--fg); border: 1px solid var(--border);
           padding: .35em .9em; cursor: pointer; border-radius: 4px; font-size: .85em; }
  button:hover { background: #444; }
  button:disabled { opacity: .4; cursor: default; }
  input, select, textarea { background: #222; color: var(--fg); border: 1px solid var(--border);
           padding: .3em .5em; border-radius: 4px; font-size: .85em; }
  input[type=file] { padding: .2em; }
  label { font-size: .85em; display: inline-block; min-width: 7em; }
  .row { display: flex; gap: .6em; align-items: center; margin: .3em 0; flex-wrap: wrap; }
  .card { background: var(--card); border: 1px solid var(--border);
          border-radius: 6px; padding: .8em; margin: .5em 0; }
  .log { background: #0a0a0a; border: 1px solid var(--border); border-radius: 4px;
         padding: .5em; height: 10em; overflow-y: auto; font-size: .78em;
         font-family: monospace; white-space: pre-wrap; word-break: break-all; }
  .badge { display: inline-block; padding: .1em .5em; border-radius: 3px;
           font-size: .75em; font-weight: bold; }
  .badge-ok   { background: #143; color: var(--ok); }
  .badge-warn { background: #331; color: var(--warn); }
  .badge-err  { background: #311; color: var(--err); }
  .preview-grid { display: flex; flex-wrap: wrap; gap: .5em; }
  .preview-grid img { width: 80px; height: 80px; object-fit: contain;
                      background: #222; border: 1px solid var(--border); border-radius: 3px; }
  .progress-bar { height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--ok); transition: width .3s; }
  table { border-collapse: collapse; width: 100%; font-size: .82em; }
  th, td { border: 1px solid var(--border); padding: .25em .5em; text-align: left; }
  th { background: #1e1e1e; color: var(--link); }
  #status-area { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .5em; }
  @media (max-width: 900px) { #status-area { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { #status-area { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<h1>Nodus — Browser Training Console</h1>

<!-- ================================================================ -->
<!--  CONNECTION                                                       -->
<!-- ================================================================ -->
<div class="card">
  <div class="row">
    <label for="server-url">Server URL</label>
    <input id="server-url" value="http://localhost:7272" style="flex:1" />
    <button id="btn-connect">Connect</button>
    <span id="conn-badge" class="badge badge-warn">disconnected</span>
  </div>
</div>

<!-- ================================================================ -->
<!--  STATUS                                                           -->
<!-- ================================================================ -->
<div id="status-area">
  <div class="card">
    <h2>Lease Status</h2>
    <div id="lease-status">—</div>
  </div>
  <div class="card">
    <h2>Latest Models</h2>
    <div id="latest-models">—</div>
  </div>
  <div class="card">
    <h2>Dataset Status</h2>
    <div id="dataset-status">—</div>
  </div>
</div>

<!-- ================================================================ -->
<!--  SUBMIT TRAINING DATA                                             -->
<!-- ================================================================ -->
<div class="card">
  <h2>Submit Training Image</h2>
  <div class="row">
    <label>Slot name</label>
    <input id="submit-slot" value="web_lease" style="width:12em" />
  </div>
  <div class="row">
    <label>Image file</label>
    <input id="submit-file" type="file" accept="image/*" multiple />
  </div>
  <div class="row">
    <label>Labels</label>
    <input id="submit-labels" placeholder="cat, dog, bird (comma separated)" style="flex:1" />
  </div>
  <div class="row">
    <button id="btn-submit">Submit Sample(s)</button>
    <span id="submit-result" style="font-size:.82em"></span>
  </div>
  <div id="submit-preview" class="preview-grid" style="margin-top:.4em"></div>
</div>

<!-- ================================================================ -->
<!--  TRAINING WORKFLOW                                                -->
<!-- ================================================================ -->
<div class="card">
  <h2>Training Workflow</h2>
  <div class="row">
    <label>Lease ID</label>
    <input id="train-lease-id" placeholder="paste lease ID or use auto" style="flex:1" />
    <button id="btn-fetch-lease">Auto-detect</button>
  </div>
  <div class="row">
    <label>Model class</label>
    <select id="train-model-class">
      <option value="TinyConvClassifier">TinyConvClassifier</option>
      <option value="ConditionalBitPlaneGenerator">ConditionalBitPlaneGenerator</option>
      <option value="ConditionalBitPlaneDiscriminator">ConditionalBitPlaneDiscriminator</option>
      <option value="WavePatchTransformer">WavePatchTransformer</option>
      <option value="DeskewFilterBundle">DeskewFilterBundle</option>
    </select>
  </div>
  <div class="row">
    <label>Input shape</label>
    <input id="train-input-shape" value="1,3,64,64" style="width:12em" />
    <label>Epochs</label>
    <input id="train-epochs" type="number" value="5" min="1" max="1000" style="width:5em" />
    <label>Batch size</label>
    <input id="train-batch" type="number" value="4" min="1" max="256" style="width:5em" />
  </div>

  <div class="row" style="margin-top:.5em">
    <button id="btn-export-onnx">1. Export ONNX</button>
    <button id="btn-load-model" disabled>2. Load Model</button>
    <button id="btn-load-latest">Load Latest</button>
    <button id="btn-run-train" disabled>3. Train</button>
    <button id="btn-return-grad" disabled>4. Return Gradients</button>
  </div>

  <div class="progress-bar" style="margin-top:.4em">
    <div id="train-progress" class="progress-fill" style="width:0%"></div>
  </div>
  <div id="train-loss" style="font-size:.82em; margin-top:.3em; color:var(--ok)"></div>
</div>

<!-- ================================================================ -->
<!--  LATEST CLASSIFIER INFERENCE                                      -->
<!-- ================================================================ -->
<div class="card">
  <h2>Latest Classifier Inference</h2>
  <div class="row">
    <button id="btn-refresh-classifier-meta">Load Latest Classifier Meta</button>
    <span id="infer-meta" style="font-size:.82em"></span>
  </div>
  <div class="row">
    <label>Image file</label>
    <input id="infer-file" type="file" accept="image/*" />
    <button id="btn-run-latest-classifier">Run Latest Classifier</button>
  </div>
  <div class="row">
    <div>
      <div style="font-size:.78em; margin-bottom:.2em">Original</div>
      <img id="infer-original" style="width:120px;height:120px;object-fit:contain;background:#222;border:1px solid var(--border);border-radius:3px" />
    </div>
    <div>
      <div style="font-size:.78em; margin-bottom:.2em">Resized</div>
      <img id="infer-resized" style="width:120px;height:120px;object-fit:contain;background:#222;border:1px solid var(--border);border-radius:3px" />
    </div>
  </div>
  <div id="infer-summary" style="font-size:.82em; margin-top:.4em"></div>
  <div id="infer-top-scores" style="margin-top:.4em"></div>
  <div id="infer-all-scores" style="margin-top:.4em; max-height:18em; overflow:auto"></div>
</div>

<!-- ================================================================ -->
<!--  DATASET PREVIEW                                                  -->
<!-- ================================================================ -->
<div class="card">
  <h2>Collection Dataset</h2>
  <div id="collection-dataset">
    <em style="font-size:.82em">Load a lease to see assigned samples.</em>
  </div>
  <div id="dataset-images" class="preview-grid" style="margin-top:.4em"></div>
</div>

<!-- ================================================================ -->
<!--  LOG                                                              -->
<!-- ================================================================ -->
<div class="card">
  <h2>Log</h2>
  <div id="log" class="log"></div>
</div>

<!-- ================================================================ -->
<!--  SCRIPTS                                                          -->
<!-- ================================================================ -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/ort.min.js"></script>
<script>
// Inline the NodusOnnxClient (the server also serves this file, but
// for self-containedness we inline core methods here and load the full
// file if available).
</script>
<script>
(function() {
"use strict";

/* ------------------------------------------------------------------ */
/*  Globals                                                           */
/* ------------------------------------------------------------------ */
let BASE = "";
let client = null;       // NodusOnnxClient instance
let session = null;      // ort.InferenceSession
let originalWeights = null;
let trainingDataset = null;  // [{input: Float32Array, target: Float32Array}]
let currentLeaseId = null;
let currentCollectionId = null;
let latestClassifierMeta = null;

const $ = (sel) => document.querySelector(sel);
const $log = (msg) => {
    const el = $("#log");
    const ts = new Date().toLocaleTimeString();
    el.textContent += `[${ts}] ${msg}\n`;
    el.scrollTop = el.scrollHeight;
};

/* ------------------------------------------------------------------ */
/*  Connect                                                           */
/* ------------------------------------------------------------------ */
$("#btn-connect").onclick = async () => {
    BASE = $("#server-url").value.replace(/\/+$/, "");
    try {
        const r = await fetch(`${BASE}/api/status`);
        if (!r.ok) throw new Error(r.status);
        const st = await r.json();
        $("#conn-badge").className = "badge badge-ok";
        $("#conn-badge").textContent = "connected";
        $log(`Connected to ${BASE} — ${st.loss_channels || 0} loss channels`);
        refreshStatus();
        loadLatestClassifierMeta(false);
    } catch (e) {
        $("#conn-badge").className = "badge badge-err";
        $("#conn-badge").textContent = "error";
        $log(`Connection failed: ${e.message}`);
    }
};

/* ------------------------------------------------------------------ */
/*  Status polling                                                    */
/* ------------------------------------------------------------------ */
async function refreshStatus() {
    if (!BASE) return;
    try {
        const lr = await fetch(`${BASE}/api/lease/status`);
        if (lr.ok) {
            const data = await lr.json();
            const slots = data.slots || {};
            let html = "<table><tr><th>Slot</th><th>Locked</th><th>Open Collections</th></tr>";
            for (const [slot, info] of Object.entries(slots)) {
                const locked = info.locked ? '<span class="badge badge-warn">locked</span>'
                                           : '<span class="badge badge-ok">free</span>';
                html += `<tr><td>${esc(slot)}</td><td>${locked}</td><td>${esc(JSON.stringify(info.open_collections || []))}</td></tr>`;
            }
            html += "</table>";
            $("#lease-status").innerHTML = html;
        }
    } catch (e) { /* ignore */ }
    try {
        const dr = await fetch(`${BASE}/api/web/dataset/status`);
        if (dr.ok) {
            const data = await dr.json();
            let html = "<table><tr><th>Slot</th><th>Total</th><th>Pending</th><th>Consumed</th></tr>";
            for (const [slot, info] of Object.entries(data)) {
                html += `<tr><td>${esc(slot)}</td><td>${info.total}</td><td>${info.pending}</td><td>${info.consumed}</td></tr>`;
            }
            html += "</table>";
            $("#dataset-status").innerHTML = html;
        }
    } catch (e) { /* ignore */ }
    try {
        const mr = await fetch(`${BASE}/api/model/latest`);
        if (mr.ok) {
            const data = await mr.json();
            const models = data.models || {};
            const names = Object.keys(models);
            if (names.length === 0) {
                $("#latest-models").innerHTML = "<em style='font-size:.82em'>No checkpoints found (--checkpoint-dir not set or empty)</em>";
            } else {
                let html = "<table><tr><th>Model</th><th>Size</th><th>Updated</th><th></th></tr>";
                for (const [name, info] of Object.entries(models)) {
                    const age = Math.round((Date.now() / 1000 - info.modified));
                    const ageStr = age < 60 ? `${age}s ago` : age < 3600 ? `${Math.round(age/60)}m ago` : `${Math.round(age/3600)}h ago`;
                    const sizeKB = Math.round(info.pt_size_bytes / 1024);
                    html += `<tr><td>${esc(name)}</td><td>${sizeKB} KB</td><td>${ageStr}</td>` +
                            `<td><a href="${esc(info.onnx_url)}" style="color:var(--link);font-size:.78em">ONNX</a></td></tr>`;
                }
                html += "</table>";
                $("#latest-models").innerHTML = html;
            }
        } else if (mr.status === 503) {
            $("#latest-models").innerHTML = "<em style='font-size:.82em'>--checkpoint-dir not configured</em>";
        }
    } catch (e) { /* ignore */ }
}
setInterval(refreshStatus, 10000);

/* ------------------------------------------------------------------ */
/*  Latest classifier inference                                       */
/* ------------------------------------------------------------------ */
async function loadLatestClassifierMeta(logResult = false) {
    if (!BASE) return null;
    try {
        const resp = await fetch(`${BASE}/api/model/latest/classifier/meta`);
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || resp.status);
        latestClassifierMeta = data;
        const shape = data.input_shape || [1, 3, 64, 64];
        $("#infer-meta").textContent = `${data.num_classes} labels @ ${shape[3]}x${shape[2]}`;
        if (logResult) $log(`Latest classifier meta loaded: ${data.num_classes} labels`);
        return data;
    } catch (e) {
        latestClassifierMeta = null;
        $("#infer-meta").textContent = `Unavailable: ${e.message}`;
        if (logResult) $log(`Classifier meta load failed: ${e.message}`);
        return null;
    }
}

function renderScoreTable(targetId, rows, title) {
    const target = $(targetId);
    if (!rows || rows.length === 0) {
        target.innerHTML = "<em style='font-size:.82em'>No scores.</em>";
        return;
    }
    let html = title ? `<div style="font-size:.82em; margin-bottom:.25em">${esc(title)}</div>` : "";
    html += "<table><tr><th>#</th><th>Label</th><th>Score</th><th>Logit</th></tr>";
    for (const row of rows) {
        html += `<tr><td>${row.index}</td><td>${esc(row.label)}</td><td>${Number(row.score).toFixed(4)}</td><td>${Number(row.logit).toFixed(4)}</td></tr>`;
    }
    html += "</table>";
    target.innerHTML = html;
}

async function runLatestClassifierFromFile(file) {
    if (!BASE) { $log("Not connected"); return; }
    if (!file) { $log("No file selected"); return; }
    const meta = latestClassifierMeta || await loadLatestClassifierMeta(false);
    if (!meta) { $log("Latest classifier metadata unavailable"); return; }

    try {
        const resized = await resizeFileToPngDataUrl(
            file,
            meta.input_shape[3] || 64,
            meta.input_shape[2] || 64,
            $("#infer-original"),
            $("#infer-resized"),
        );
        const resp = await fetch(`${BASE}/api/model/latest/classifier/infer`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ image_b64: resized, topk: 12 }),
        });
        const result = await resp.json();
        if (!resp.ok) throw new Error(result.error || resp.status);

        const top = result.top_scores || [];
        const image = result.image || {};
        const summary = top.length
            ? `Top hit: ${top[0].label} (${Number(top[0].score).toFixed(4)})`
            : "No scores returned.";
        $("#infer-summary").textContent =
            `${summary}  Original ${image.original_width || "?"}x${image.original_height || "?"} → ` +
            `${image.resized_width || "?"}x${image.resized_height || "?"}`;
        renderScoreTable("#infer-top-scores", top, "Top scores");
        renderScoreTable("#infer-all-scores", result.scores || [], "Full labeled score vector");
        $log(`Latest classifier ran on ${file.name}: ${top.length ? `${top[0].label}=${Number(top[0].score).toFixed(4)}` : "no result"}`);
    } catch (e) {
        $("#infer-summary").textContent = `Inference failed: ${e.message}`;
        $("#infer-top-scores").innerHTML = "";
        $("#infer-all-scores").innerHTML = "";
        $log(`Latest classifier inference failed: ${e.message}`);
    }
}

$("#btn-refresh-classifier-meta").onclick = async () => {
    await loadLatestClassifierMeta(true);
};

$("#btn-run-latest-classifier").onclick = async () => {
    const file = ($("#infer-file").files || [])[0];
    await runLatestClassifierFromFile(file);
};

/* ------------------------------------------------------------------ */
/*  Submit training sample                                            */
/* ------------------------------------------------------------------ */
$("#btn-submit").onclick = async () => {
    const slot = $("#submit-slot").value.trim();
    const labels = $("#submit-labels").value.split(",").map(s => s.trim()).filter(Boolean);
    const files = $("#submit-file").files;
    if (!files.length) { $log("No files selected"); return; }
    if (!labels.length) { $log("No labels entered"); return; }
    if (!BASE) { $log("Not connected"); return; }

    const preview = $("#submit-preview");
    preview.innerHTML = "";
    let submitted = 0;

    for (const file of files) {
        try {
            const b64 = await fileToBase64(file);
            const resp = await fetch(`${BASE}/api/web/dataset/${encodeURIComponent(slot)}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ image_b64: b64, labels, client_hint: "browser_ui" }),
            });
            const result = await resp.json();
            if (resp.ok) {
                submitted++;
                const img = document.createElement("img");
                img.src = `${BASE}/api/web/dataset/${encodeURIComponent(slot)}/${encodeURIComponent(result.sample_id)}/image.png`;
                img.title = `${result.sample_id} — ${labels.join(", ")}`;
                preview.appendChild(img);
                $log(`Submitted ${file.name} → ${result.sample_id}`);
            } else {
                $log(`Error submitting ${file.name}: ${result.error}`);
            }
        } catch (e) {
            $log(`Failed to submit ${file.name}: ${e.message}`);
        }
    }
    $("#submit-result").textContent = `${submitted}/${files.length} submitted`;
    refreshStatus();
};

/* ------------------------------------------------------------------ */
/*  Auto-detect active lease                                          */
/* ------------------------------------------------------------------ */
$("#btn-fetch-lease").onclick = async () => {
    if (!BASE) { $log("Not connected"); return; }
    try {
        const r = await fetch(`${BASE}/api/lease/status`);
        const data = await r.json();
        const slots = data.slots || {};
        // Find first slot with an open collection
        for (const [slot, info] of Object.entries(slots)) {
            const ids = info.open_collections || [];
            if (ids.length > 0) {
                const collId = ids[0];
                const cr = await fetch(`${BASE}/api/lease/collection/${encodeURIComponent(collId)}`);
                const coll = await cr.json();
                const leases = coll.leases || [];
                const active = leases.find(l => l.status === "active");
                if (active) {
                    $("#train-lease-id").value = active.lease_id;
                    currentLeaseId = active.lease_id;
                    currentCollectionId = collId;
                    $log(`Auto-detected lease ${active.lease_id} (collection ${collId}, slot ${slot})`);
                    loadDatasetPreview(active.lease_id);
                    return;
                }
            }
        }
        $log("No active lease found — the pipeline must open a collection first.");
    } catch (e) {
        $log(`Lease detection failed: ${e.message}`);
    }
};

/* ------------------------------------------------------------------ */
/*  Dataset preview                                                   */
/* ------------------------------------------------------------------ */
async function loadDatasetPreview(leaseId) {
    try {
        const r = await fetch(`${BASE}/api/web/lease/${encodeURIComponent(leaseId)}/dataset`);
        const data = await r.json();
        const el = $("#collection-dataset");
        const imgEl = $("#dataset-images");
        imgEl.innerHTML = "";

        if (!data.samples || data.samples.length === 0) {
            el.innerHTML = "<em>No samples assigned to this collection.</em>";
            return;
        }
        el.innerHTML = `<strong>${data.samples.length}</strong> sample(s) in collection <code>${esc(data.collection_id)}</code>`;
        trainingDataset = [];

        for (const s of data.samples) {
            const imgUrl = `${BASE}/api/web/dataset/${encodeURIComponent(data.slot_name)}/${encodeURIComponent(s.sample_id)}/image.png`;
            const img = document.createElement("img");
            img.src = imgUrl;
            img.title = `${s.sample_id}\n${(s.labels || []).join(", ")}`;
            imgEl.appendChild(img);
        }
        $log(`Loaded ${data.samples.length} dataset sample(s) for preview`);
    } catch (e) {
        $log(`Dataset preview failed: ${e.message}`);
    }
}

/* ------------------------------------------------------------------ */
/*  Step 1: Export ONNX                                               */
/* ------------------------------------------------------------------ */
$("#btn-export-onnx").onclick = async () => {
    if (!BASE) { $log("Not connected"); return; }
    const leaseId = $("#train-lease-id").value.trim();
    if (!leaseId) { $log("Enter a lease ID first"); return; }
    currentLeaseId = leaseId;

    // Resolve collection_id from lease
    try {
        const lr = await fetch(`${BASE}/api/lease/${encodeURIComponent(leaseId)}`);
        if (!lr.ok) { $log(`Lease lookup failed: ${lr.status}`); return; }
        const lease = await lr.json();
        currentCollectionId = lease.collection_id;
    } catch (e) {
        $log(`Lease lookup error: ${e.message}`);
        return;
    }

    const modelClass = $("#train-model-class").value;
    const inputShape = $("#train-input-shape").value.split(",").map(Number);

    $log(`Requesting ONNX export: collection=${currentCollectionId}, model=${modelClass}, shape=[${inputShape}]`);
    try {
        const r = await fetch(`${BASE}/api/onnx/export`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                collection_id: currentCollectionId,
                model_class: modelClass,
                input_shape: inputShape,
            }),
        });
        const result = await r.json();
        if (r.ok) {
            $log(`ONNX exported: ${result.onnx_size_bytes} bytes, opset ${result.opset_version}`);
            $("#btn-load-model").disabled = false;
        } else {
            $log(`ONNX export failed: ${result.error}`);
        }
    } catch (e) {
        $log(`ONNX export error: ${e.message}`);
    }
};

/* ------------------------------------------------------------------ */
/*  Step 2: Load Model in browser                                     */
/* ------------------------------------------------------------------ */
$("#btn-load-model").onclick = async () => {
    if (!BASE || !currentLeaseId) { $log("No lease selected"); return; }
    const url = `${BASE}/api/web/lease/${encodeURIComponent(currentLeaseId)}/weights.onnx`;
    $log(`Downloading ONNX model from ${url} …`);
    try {
        const resp = await fetch(url);
        if (!resp.ok) {
            const txt = await resp.text();
            $log(`Model download failed: ${resp.status} ${txt}`);
            return;
        }
        const buf = await resp.arrayBuffer();
        $log(`Downloaded ${buf.byteLength} bytes, creating session …`);

        session = await ort.InferenceSession.create(new Uint8Array(buf), {
            executionProviders: ["wasm"],
        });
        $log(`Model loaded: inputs=[${session.inputNames}] outputs=[${session.outputNames}]`);
        $("#btn-run-train").disabled = false;

        // Pre-fetch dataset images as training data
        await prepareTrainingData();
    } catch (e) {
        $log(`Model load error: ${e.message}`);
    }
};

/* ------------------------------------------------------------------ */
/*  Load Latest: bypass lease, fetch freshest checkpoint as ONNX      */
/* ------------------------------------------------------------------ */
$("#btn-load-latest").onclick = async () => {
    if (!BASE) { $log("Not connected"); return; }

    // Determine which model name to fetch
    const classToName = {
        "TinyConvClassifier": "classifier",
        "ConditionalBitPlaneGenerator": "generator",
        "ConditionalBitPlaneDiscriminator": "discriminator",
        "WavePatchTransformer": "transformer",
        "DeskewFilterBundle": "wave_classifier",
    };
    const modelClass = $("#train-model-class").value;
    const modelName = classToName[modelClass] || "classifier";
    const inputShape = $("#train-input-shape").value.trim();

    const url = `${BASE}/api/model/latest/${encodeURIComponent(modelName)}.onnx` +
                `?model_class=${encodeURIComponent(modelClass)}` +
                `&input_shape=${encodeURIComponent(inputShape)}`;
    $log(`Fetching latest ${modelName} as ONNX …`);

    try {
        const resp = await fetch(url);
        if (!resp.ok) {
            let msg = resp.status.toString();
            try { msg = (await resp.json()).error || msg; } catch (_) {}
            $log(`Latest model fetch failed: ${msg}`);
            return;
        }
        const buf = await resp.arrayBuffer();
        $log(`Downloaded ${buf.byteLength} bytes, creating session …`);

        session = await ort.InferenceSession.create(new Uint8Array(buf), {
            executionProviders: ["wasm"],
        });
        $log(`Latest model loaded: inputs=[${session.inputNames}] outputs=[${session.outputNames}]`);
        $("#btn-run-train").disabled = false;
    } catch (e) {
        $log(`Latest model load error: ${e.message}`);
    }
};

/* ------------------------------------------------------------------ */
/*  Prepare training data from dataset images                         */
/* ------------------------------------------------------------------ */
async function prepareTrainingData() {
    if (!BASE || !currentLeaseId) return;
    try {
        const r = await fetch(`${BASE}/api/web/lease/${encodeURIComponent(currentLeaseId)}/dataset`);
        const data = await r.json();
        if (!data.samples || data.samples.length === 0) {
            $log("No training samples available");
            return;
        }

        const inputShape = $("#train-input-shape").value.split(",").map(Number);
        const C = inputShape[1] || 3, H = inputShape[2] || 64, W = inputShape[3] || 64;
        trainingDataset = [];

        const canvas = document.createElement("canvas");
        canvas.width = W; canvas.height = H;
        const ctx2d = canvas.getContext("2d");

        for (const s of data.samples) {
            try {
                const imgUrl = `${BASE}/api/web/dataset/${encodeURIComponent(data.slot_name)}/${encodeURIComponent(s.sample_id)}/image.png`;
                const img = await loadImage(imgUrl);
                ctx2d.clearRect(0, 0, W, H);
                ctx2d.drawImage(img, 0, 0, W, H);
                const imageData = ctx2d.getImageData(0, 0, W, H);

                // Convert RGBA uint8 → CHW float32
                const input = new Float32Array(C * H * W);
                for (let y = 0; y < H; y++) {
                    for (let x = 0; x < W; x++) {
                        const idx = (y * W + x) * 4;
                        for (let c = 0; c < Math.min(C, 3); c++) {
                            input[c * H * W + y * W + x] = imageData.data[idx + c] / 255.0;
                        }
                    }
                }

                // Target: simple one-hot from label index (placeholder — real targets vary by model)
                const numClasses = session.outputNames.length > 0 ? 10 : 10;
                const target = new Float32Array(numClasses);
                if (s.labels && s.labels.length > 0) {
                    // Hash first label to a class index
                    let hash = 0;
                    for (let i = 0; i < s.labels[0].length; i++) hash = (hash * 31 + s.labels[0].charCodeAt(i)) & 0x7fffffff;
                    target[hash % numClasses] = 1.0;
                }

                trainingDataset.push({ input, target, labels: s.labels || [] });
            } catch (e) {
                $log(`Skipping sample ${s.sample_id}: ${e.message}`);
            }
        }
        $log(`Prepared ${trainingDataset.length} training sample(s)`);
    } catch (e) {
        $log(`Dataset preparation error: ${e.message}`);
    }
}

/* ------------------------------------------------------------------ */
/*  Step 3: Run Training (inference-based pseudo-training)            */
/* ------------------------------------------------------------------ */
/*
 * Full ONNX Runtime Training requires `ort.TrainingSession` which needs
 * a training-enabled WASM build + training artifacts.  When that's not
 * available we fall back to "inference-based training":
 *
 *   1. Run forward pass → get loss (or output delta)
 *   2. Record the input/output for gradient estimation
 *   3. Return computed deltas to server
 *
 * This still lets the server-side pipeline apply corrections, but the
 * real on-device weight update only works with the training build.
 */
let inferenceOutputs = [];

$("#btn-run-train").onclick = async () => {
    if (!session || !trainingDataset || trainingDataset.length === 0) {
        $log("Model or dataset not ready");
        return;
    }
    const epochs = parseInt($("#train-epochs").value) || 5;
    const batchSize = parseInt($("#train-batch").value) || 4;
    const inputShape = $("#train-input-shape").value.split(",").map(Number);
    const totalBatches = Math.ceil(trainingDataset.length / batchSize);

    inferenceOutputs = [];
    $log(`Starting training: ${epochs} epoch(s), batch_size=${batchSize}, ${trainingDataset.length} sample(s)`);

    const hasTraining = typeof ort.TrainingSession !== "undefined";
    if (hasTraining) {
        $log("ort.TrainingSession detected — real on-device training available");
    } else {
        $log("ort.TrainingSession not available — running inference-based contribution mode");
    }

    for (let ep = 0; ep < epochs; ep++) {
        let epochLoss = 0;
        let batchCount = 0;

        for (let bi = 0; bi < totalBatches; bi++) {
            const start = bi * batchSize;
            const end = Math.min(start + batchSize, trainingDataset.length);
            const batchSamples = trainingDataset.slice(start, end);

            for (const sample of batchSamples) {
                try {
                    const tensor = new ort.Tensor("float32", sample.input, inputShape);
                    const feeds = { [session.inputNames[0]]: tensor };
                    const results = await session.run(feeds);
                    const output = results[session.outputNames[0]];

                    // Compute cross-entropy-like loss against target
                    const outData = output.data;
                    let loss = 0;
                    for (let i = 0; i < Math.min(outData.length, sample.target.length); i++) {
                        const p = Math.max(1e-7, Math.min(1 - 1e-7, outData[i]));
                        const t = sample.target[i];
                        loss -= t * Math.log(p) + (1 - t) * Math.log(1 - p);
                    }
                    epochLoss += loss;
                    batchCount++;

                    // Store output for gradient estimation
                    inferenceOutputs.push({
                        input: sample.input,
                        output: new Float32Array(outData),
                        target: sample.target,
                    });
                } catch (e) {
                    $log(`Batch error: ${e.message}`);
                }
            }

            // Update progress
            const pct = ((ep * totalBatches + bi + 1) / (epochs * totalBatches) * 100);
            $("#train-progress").style.width = pct + "%";
        }

        const avgLoss = batchCount > 0 ? (epochLoss / batchCount) : 0;
        $log(`Epoch ${ep + 1}/${epochs} — avg loss: ${avgLoss.toFixed(4)}`);
        $("#train-loss").textContent = `Epoch ${ep + 1}: loss = ${avgLoss.toFixed(4)}`;
    }

    $log(`Training complete — ${inferenceOutputs.length} forward passes recorded`);
    $("#btn-return-grad").disabled = false;
};

/* ------------------------------------------------------------------ */
/*  Step 4: Return Gradients                                          */
/* ------------------------------------------------------------------ */
$("#btn-return-grad").onclick = async () => {
    if (!currentLeaseId || !BASE) { $log("No lease or connection"); return; }

    if (inferenceOutputs.length === 0) {
        $log("No training outputs to return");
        return;
    }

    $log("Computing gradient estimate from inference outputs …");

    // Compute pseudo-gradients: for each output, compute (output - target) as the
    // gradient signal.  This is the gradient of MSE loss w.r.t. the output.
    // Pack into a flat npz-compatible structure.
    const totalOutputSize = inferenceOutputs[0].output.length;
    const gradAccum = new Float32Array(totalOutputSize);
    for (const entry of inferenceOutputs) {
        for (let i = 0; i < totalOutputSize; i++) {
            gradAccum[i] += (entry.output[i] - entry.target[i]) / inferenceOutputs.length;
        }
    }

    // Encode as minimal npz
    const npzBytes = encodeNpz({ "output_gradient": gradAccum });

    $log(`Returning gradient blob (${npzBytes.byteLength} bytes) for lease ${currentLeaseId} …`);
    try {
        const r = await fetch(`${BASE}/api/lease/${encodeURIComponent(currentLeaseId)}/gradients`, {
            method: "POST",
            body: npzBytes,
        });
        const result = await r.json();
        if (r.ok) {
            $log(`Gradients returned successfully. Collection complete: ${result.collection_complete}`);
            $("#btn-return-grad").disabled = true;
            refreshStatus();
        } else {
            $log(`Gradient return failed: ${JSON.stringify(result)}`);
        }
    } catch (e) {
        $log(`Gradient return error: ${e.message}`);
    }
};

/* ------------------------------------------------------------------ */
/*  NPZ encoder (minimal, float32, STORE compression)                 */
/* ------------------------------------------------------------------ */
function encodeNpz(arrays) {
    const files = [];
    for (const [name, arr] of Object.entries(arrays)) {
        files.push({ name: name + ".npy", data: encodeNpy(arr) });
    }
    return buildZip(files);
}

function encodeNpy(arr) {
    const shape = `(${arr.length},)`;
    const header = `{'descr': '<f4', 'fortran_order': False, 'shape': ${shape}, }`;
    const preambleLen = 10;
    let padded = header;
    while ((preambleLen + padded.length + 1) % 64 !== 0) padded += " ";
    padded += "\n";
    const headerBytes = new TextEncoder().encode(padded);
    const buf = new Uint8Array(preambleLen + headerBytes.length + arr.byteLength);
    buf[0]=0x93; buf[1]=0x4e; buf[2]=0x55; buf[3]=0x4d; buf[4]=0x50; buf[5]=0x59;
    buf[6]=1; buf[7]=0;
    buf[8] = headerBytes.length & 0xff;
    buf[9] = (headerBytes.length >> 8) & 0xff;
    buf.set(headerBytes, 10);
    buf.set(new Uint8Array(arr.buffer, arr.byteOffset, arr.byteLength), preambleLen + headerBytes.length);
    return buf;
}

function buildZip(files) {
    const enc = new TextEncoder();
    const parts = [];
    const centralDir = [];
    let offset = 0;

    for (const f of files) {
        const nameBytes = enc.encode(f.name);
        const crc = crc32(f.data);
        const lfh = new Uint8Array(30 + nameBytes.length);
        const v = new DataView(lfh.buffer);
        v.setUint32(0, 0x04034b50, true);
        v.setUint16(4, 20, true);
        v.setUint16(8, 0, true);
        v.setUint32(14, crc, true);
        v.setUint32(18, f.data.length, true);
        v.setUint32(22, f.data.length, true);
        v.setUint16(26, nameBytes.length, true);
        lfh.set(nameBytes, 30);

        const cd = new Uint8Array(46 + nameBytes.length);
        const cv = new DataView(cd.buffer);
        cv.setUint32(0, 0x02014b50, true);
        cv.setUint16(4, 20, true);
        cv.setUint16(6, 20, true);
        cv.setUint16(10, 0, true);
        cv.setUint32(16, crc, true);
        cv.setUint32(20, f.data.length, true);
        cv.setUint32(24, f.data.length, true);
        cv.setUint16(28, nameBytes.length, true);
        cv.setUint32(42, offset, true);
        cd.set(nameBytes, 46);

        parts.push(lfh, f.data);
        centralDir.push(cd);
        offset += lfh.length + f.data.length;
    }

    const cdOffset = offset;
    let cdSize = 0;
    for (const cd of centralDir) cdSize += cd.length;
    const eocd = new Uint8Array(22);
    const ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, cdOffset, true);

    const totalLen = offset + cdSize + 22;
    const out = new Uint8Array(totalLen);
    let pos = 0;
    for (const p of parts) { out.set(p, pos); pos += p.length; }
    for (const c of centralDir) { out.set(c, pos); pos += c.length; }
    out.set(eocd, pos);
    return out;
}

let crcTable = null;
function crc32(data) {
    if (!crcTable) {
        crcTable = new Uint32Array(256);
        for (let n = 0; n < 256; n++) {
            let c = n;
            for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
            crcTable[n] = c;
        }
    }
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < data.length; i++) crc = crcTable[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
}

/* ------------------------------------------------------------------ */
/*  Utilities                                                         */
/* ------------------------------------------------------------------ */
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
            // Strip data URL prefix: "data:image/png;base64,..."
            const result = reader.result;
            const idx = result.indexOf(",");
            resolve(idx >= 0 ? result.substring(idx + 1) : result);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

async function resizeFileToPngDataUrl(file, width, height, originalImgEl, resizedImgEl) {
    const dataUrl = await fileToDataUrl(file);
    const img = await loadImage(dataUrl);
    if (originalImgEl) originalImgEl.src = dataUrl;
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Number(width) || 64);
    canvas.height = Math.max(1, Number(height) || 64);
    const ctx2d = canvas.getContext("2d");
    ctx2d.clearRect(0, 0, canvas.width, canvas.height);
    ctx2d.drawImage(img, 0, 0, canvas.width, canvas.height);
    const resizedDataUrl = canvas.toDataURL("image/png");
    if (resizedImgEl) resizedImgEl.src = resizedDataUrl;
    return resizedDataUrl;
}

function loadImage(url) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Image load failed"));
        img.src = url;
    });
}

function esc(s) {
    const d = document.createElement("div");
    d.textContent = String(s);
    return d.innerHTML;
}

})();
